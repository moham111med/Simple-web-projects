<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Form</title>
</head>
<body>
    <div class="card">
        <h1>Enter your Data</h1>
        <form id="userForm">
            <label for="name">Name</label>
            <input type="text" id="name" name="name" placeholder="Ahmed">
            <br>
            <label for="age">Age</label>
            <input type="number" id="age" name="age" placeholder="20" min="10" max="100">
            <br>
            <label for="hobby">Hobby</label>
            <input type="text" id="hobby" name="hobby" placeholder="Swimming">
            <br>
            <button type="submit">Submit</button>
        </form>
    </div>
<script src="main.js">

</script>
</body>
</html>
